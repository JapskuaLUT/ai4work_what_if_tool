version: "3.8"

services:
    nginx:
        image: nginx:1.25-alpine
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./traefik/certs:/etc/nginx/certs:ro
        depends_on:
            - ui
            - backend
            - postgres
            - ollama-proxy
        networks:
            - what_if_network

    ui:
        image: whatif-ui:dev
        volumes:
            - ./ui:/usr/src/app
            - /usr/src/app/node_modules
        networks:
            - what_if_network
        environment:
            - VITE_BACKEND_API_URL=https://backend.localhost/api
            - VITE_OLLAMA_API_URL=https://ollama.localhost/api
        command: bun dev -- --host
        # Removed all Traefik labels

    backend:
        image: whatif-backend:dev
        volumes:
            - ./backend:/usr/src/app
        networks:
            - what_if_network
        command: bun dev
        environment:
            - SERVER_URL=https://backend.localhost
            - DATABASE_URL=postgres://whatifuser:whatifpassword@postgres:5432/whatifdatabase
            - JWT_SECRET=your-SHARED-strong-jwt-secret
            - APP_BASE_URL=https://app.localhost
            - API_BASE_URL=https://backend.localhost
        # Removed all Traefik labels

    postgres:
        image: postgres:17.5
        environment:
            - POSTGRES_USER=whatifuser
            - POSTGRES_PASSWORD=whatifpassword
            - POSTGRES_DB=whatifdatabase
        ports:
            - "5432:5432"
        volumes:
            - ./postgres_whatif_data:/var/lib/postgresql/data
            - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
            - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U whatifuser -d whatifdatabase"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - what_if_network
        # Removed all Traefik labels

    ollama-proxy:
        image: whatif-ollama-proxy:dev
        networks:
            - what_if_network
        # Removed all Traefik labels

networks:
    what_if_network:
        name: what_if_network
        driver: bridge
