server {
    listen 80;
    server_name ollama.localhost;

    # Local LLM responses can take minutes (long prompts + reasoning models).
    # Default nginx proxy_*_timeout is 60s, which produces a 504 → no CORS
    # headers on the response → browsers report it as a CORS error.
    # 10 minutes is generous for any local model on this box.
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # Stream responses (Ollama's stream:true) byte-by-byte instead of buffering.
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location / {
        # Handle preflight OPTIONS requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }


        proxy_pass http://host.docker.internal:11434;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
