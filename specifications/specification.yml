openapi: 3.0.3
info:
  title: Course Adjustment Simulation API
  version: 1.0.0
  description: |
    This API defines the workflow for running **course adjustment simulations**
    that redistribute workloads and optimize stress levels.  
    Communication occurs over **HTTP**, and **security (authentication, authorization)**
    is handled externally by the orchestrating client or gateway, not within this API.  

    ### Workflow Overview
    1. The client sends a **POST** request to `/api/simulations/` with course analysis input.  
    2. The service returns a `caseId` and a `resultsUrl` for retrieving results later.  
    3. The client then calls **GET** `/api/simulations/{caseId}` to fetch all generated adjustments.  
    4. Optionally, a single adjustment can be fetched via **GET** `/api/simulations/{caseId}/{adjustmentId}`.

servers:
  - url: http://localhost

paths:
  /api/simulations/:
    post:
      summary: Start a new course adjustment simulation
