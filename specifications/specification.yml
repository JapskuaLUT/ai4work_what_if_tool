components:
  schemas:
    SimulationStartResponse:
      type: object
      required: [caseId, resultsUrl]
      properties:
        caseId: { type: string, format: uuid }
        resultsUrl: { type: string, format: uri }

    CourseAnalysisInput:
      type: object
      required: [name, course_info, assignment_weeks, current_status, week_schedules, metadata]
      properties:
        name: { type: string }
        description: { type: string }
        course_info: { $ref: '#/components/schemas/CourseInfoInput' }
        assignment_weeks:
          type: array
          items: { $ref: '#/components/schemas/AssignmentWeekInput' }
        current_status: { $ref: '#/components/schemas/CurrentStatusInput' }
        week_schedules:
          type: array
          items: { $ref: '#/components/schemas/WeekScheduleInput' }
        optimization_request: { $ref: '#/components/schemas/OptimizationRequest' }
        students:
          type: object
          properties:
            count: { type: integer }
        metadata: { $ref: '#/components/schemas/Metadata' }

    CourseAnalysisOutput:
      type: object
      required: [name, description, course_info, assignment_weeks, current_status, week_schedules, optimization_request, metadata]
      properties:
        name: { type: string }
        description: { type: string }
        course_info: { $ref: '#/components/schemas/CourseInfoInput' }
        assignment_weeks:
          type: array
          items: { $ref: '#/components/schemas/AssignmentWeekInput' }
        current_status: { $ref: '#/components/schemas/CurrentStatusInput' }
        week_schedules:
          type: array
          items: { $ref: '#/components/schemas/AdjustmentWeekScheduleGroup' }
        optimization_request: { $ref: '#/components/schemas/OptimizationRequest' }
        students:
          type: object
          properties:
            count: { type: integer }
        metadata: { $ref: '#/components/schemas/Metadata' }

    AdjustmentWeekScheduleGroup:
      type: object
      required: [adjustment_id, week_schedules]
      properties:
        adjustment_id:
          type: string
          example: adjustment_1
        week_schedules:
          type: array
          items: { $ref: '#/components/schemas/WeekScheduleInput' }

    AdjustmentDetail:
      type: object
      required:
        - adjustment_id
        - name
        - feasibility_score
        - key_changes
        - peak_stress
        - total_hours_maintained
        - optimization_summary
        - week_schedules
      properties:
        adjustment_id:
          type: string
          example: adjustment_2
        name:
          type: string
          example: "Balanced Optimization with Redistribution"
        feasibility_score:
          type: number
          format: float
          example: 89.2
        key_changes:
          type: string
          example: "Assignment extensions + strategic hour redistribution"
        peak_stress:
          type: number
          format: float
          example: 98.6
        total_hours_maintained:
          type: boolean
          example: true
        optimization_summary:
          $ref: '#/components/schemas/OptimizationSummary'
        week_schedules:
          type: array
          description: Detailed week-by-week schedule for this adjustment
          items:
            $ref: '#/components/schemas/WeekScheduleWithChanges'
    
    OptimizationSummary:
      type: object
      description: Summary of optimization performance and effects.
      required:
        - learning_outcomes_maintained
        - hours_redistributed
        - total_hours_maintained
      properties:
        stress_reduction_achieved:
          type: number
          format: float
          description: Percentage of stress reduction achieved across the adjustment.
          example: 18.7
        learning_outcomes_maintained:
          type: boolean
          description: Whether the academic learning objectives remained unaffected.
          example: true
        total_adjustments_made:
          type: integer
          description: Number of week-level adjustments made during optimization.
          example: 12
        extensions_used:
          type: integer
          description: Number of assignment deadline extensions applied.
          example: 2
        hours_redistributed:
          type: boolean
          description: Indicates if workload redistribution was applied.
          example: true
        total_hours_maintained:
          type: boolean
          description: Confirms total teaching/lab/homework hours remain consistent.
          example: true


    WeekScheduleWithChanges:
      allOf:
        - $ref: '#/components/schemas/WeekScheduleInput'
        - type: object
          properties:
            optimization_changes:
              type: object
              description: Present only if `adjusted` is true. Contains the before/after optimization details.
              required:
                - original_homework_hours
                - original_teaching_hours
                - original_lab_hours
                - hours_redistributed
                - change_reason
              properties:
                original_homework_hours:
                  type: integer
                  description: Homework hours before optimization
                  example: 10
                original_teaching_hours:
                  type: integer
                  description: Teaching hours before optimization
                  example: 5
                original_lab_hours:
                  type: integer
                  description: Lab hours before optimization
                  example: 3
                hours_redistributed:
                  type: boolean
                  description: Indicates whether workload hours were redistributed
                  example: true
                change_reason:
                  type: string
                  description: Optimization reason or strategy applied
                  example: "stress_optimization_with_hour_redistribution"



    # --- Supporting Schemas ---
    CourseInfoInput:
      type: object
      required: [course_name, course_id, teaching_hours, lab_hours, ects, topic_difficulty, has_prerequisites, total_homework_hours, total_weeks, total_assignments, attendance_method]
      properties:
        course_name: { type: string }
        course_id: { type: string }
        teaching_hours: { type: integer }
        lab_hours: { type: integer }
        ects: { type: integer }
        topic_difficulty: { type: integer }
        has_prerequisites: { type: boolean }
        total_homework_hours: { type: integer }
        total_weeks: { type: integer }
        total_assignments: { type: integer }
        attendance_method: { type: string }
        success_rate_percent: { type: number, format: float, nullable: true }
        average_grade: { type: number, format: float, nullable: true }
        course_sessions:
          type: array
          items: { $ref: '#/components/schemas/Session' }
        lab_sessions:
          type: array
          items: { $ref: '#/components/schemas/Session' }

    Session:
      type: object
      required: [day, start_time, end_time]
      properties:
        day: { type: string }
        start_time: { type: string, example: "18:00" }
        end_time: { type: string, example: "21:00" }

    AssignmentWeekInput:
      type: object
      required: [id, start_week, end_week, extensions]
      properties:
        id: { type: integer }
        start_week: { type: integer }
        end_week: { type: integer }
        extensions:
          type: array
          items: { type: object }

    CurrentStatusInput:
      type: object
      required: [current_week, latest_adjusted_week]
      properties:
        current_week: { type: integer }
        latest_adjusted_week: { type: integer }

    WeekScheduleInput:
      type: object
      required: [week_number, adjusted, teaching_hours, lab_hours, homework_hours, stress_metrics]
      properties:
        week_number: { type: integer }
        adjusted: { type: boolean }
        teaching_hours: { type: integer }
        lab_hours: { type: integer }
        homework_hours: { type: integer }
        stress_metrics:
          $ref: '#/components/schemas/StressMetrics'

    StressMetrics:
      type: object
      required: [average_stress, maximum_stress]
      properties:
        average_stress: { type: number }
        maximum_stress: { type: number }

    OptimizationRequest:
      type: object
      properties:
        optimization_target: { type: string }
        stress_threshold_warning: { type: number }
        stress_threshold_critical: { type: number }
        allow_extensions: { type: boolean }
        max_extensions_per_assignment: { type: integer }
        consider_all_remaining_weeks: { type: boolean }

    Metadata:
      type: object
      required: [created_at, creator_id, semester_id]
      properties:
        created_at: { type: string, format: date-time }
        creator_id: { type: string }
        semester_id: { type: string }
